services:
  - type: web
    name: mini-erp-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false   # Set this manually in Render dashboard — never commit
      - key: JWT_SECRET
        sync: false   # Set this manually in Render dashboard — never commit
      - key: FRONTEND_URL
        sync: false   # Set this to your Vercel frontend URL e.g. https://your-app.vercel.app
